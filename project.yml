name: Loge
options:
  bundleIdPrefix: com.h6245
settings:
  base:
    DEVELOPMENT_TEAM: 6X5CP5SFAG
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # One build number for the app and its extension; release-testflight.sh overrides it (ADR 0022).
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_LANGUAGE: fr
targets:
  Loge:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
    dependencies:
      # Fetched by scripts/fetch-vlckit.sh (ADR 0007).
      - framework: Vendor/TVVLCKit.xcframework
        embed: true
      - target: LogeTopShelf
        embed: true
    entitlements:
      path: Config/Loge.entitlements
      properties:
        # Locked to the existing App Store Connect app / profiles (com.h6245.vortxtv).
        com.apple.security.application-groups: [group.com.h6245.vortxtv]
    info:
      path: Config/Loge-Info.plist
      properties:
        UIRequiredDeviceCapabilities: [arm64]
        # loge://play?id=... opens the app from the Top Shelf (ADR 0015).
        CFBundleDisplayName: Loge
        CFBundleURLTypes:
          - CFBundleURLName: com.h6245.loge.link
            CFBundleURLSchemes: [loge]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.h6245.vortxtv
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: 2.0
      ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
      ENABLE_BITCODE: NO
  LogeTopShelf:
    type: app-extension
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: TopShelf
      # Compiled into the extension too: it reads the shared library data (ADR 0015).
      - path: Sources/Shared
      - path: Sources/Models
    entitlements:
      path: Config/TopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.com.h6245.vortxtv]
    info:
      path: Config/TopShelf-Info.plist
      properties:
        CFBundleDisplayName: Loge Top Shelf
        UIRequiredDeviceCapabilities: [arm64]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.h6245.vortxtv.topshelf
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: 2.0
  LogeTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
    dependencies:
      - target: Loge
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.h6245.vortxtv.tests
      GENERATE_INFOPLIST_FILE: YES
schemes:
  Loge:
    build:
      targets:
        Loge: all
        LogeTests: [test]
    test:
      targets:
        - LogeTests
