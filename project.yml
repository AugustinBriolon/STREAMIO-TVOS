name: StremioTV
options:
  bundleIdPrefix: com.h6245
settings:
  base:
    DEVELOPMENT_TEAM: 6X5CP5SFAG
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  StremioTV:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.h6245.vortxtv
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 2.0
      ASSETCATALOG_COMPILER_APPICON_NAME: ""
      ENABLE_BITCODE: NO
  StremioTVTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
    dependencies:
      - target: StremioTV
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.h6245.vortxtv.tests
      GENERATE_INFOPLIST_FILE: YES
schemes:
  StremioTV:
    build:
      targets:
        StremioTV: all
        StremioTVTests: [test]
    test:
      targets:
        - StremioTVTests
