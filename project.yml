name: StremioTV
options:
  bundleIdPrefix: com.h6245
settings:
  base:
    DEVELOPMENT_TEAM: 6X5CP5SFAG
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: fr
targets:
  StremioTV:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
    dependencies:
      # Fetched by scripts/fetch-vlckit.sh (ADR 0007).
      - framework: Vendor/TVVLCKit.xcframework
        embed: true
      - target: StremioTVTopShelf
        embed: true
    entitlements:
      path: Config/StremioTV.entitlements
      properties:
        com.apple.security.application-groups: [group.com.h6245.vortxtv]
    info:
      path: Config/StremioTV-Info.plist
      properties:
        # stremiotv://play?id=... opens the app from the Top Shelf (ADR 0015).
        CFBundleURLTypes:
          - CFBundleURLName: com.h6245.vortxtv.link
            CFBundleURLSchemes: [stremiotv]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.h6245.vortxtv
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 2.0
      ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
      ENABLE_BITCODE: NO
  StremioTVTopShelf:
    type: app-extension
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: TopShelf
      # Compiled into the extension too: it reads the shared library data (ADR 0015).
      - path: Sources/Shared
      - path: Sources/Models
    entitlements:
      path: Config/TopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.com.h6245.vortxtv]
    info:
      path: Config/TopShelf-Info.plist
      properties:
        CFBundleDisplayName: StremioTV Top Shelf
        # Same version as the app, or App Store validation rejects the embedded extension.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.h6245.vortxtv.topshelf
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 2.0
  StremioTVTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
    dependencies:
      - target: StremioTV
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.h6245.vortxtv.tests
      GENERATE_INFOPLIST_FILE: YES
schemes:
  StremioTV:
    build:
      targets:
        StremioTV: all
        StremioTVTests: [test]
    test:
      targets:
        - StremioTVTests
